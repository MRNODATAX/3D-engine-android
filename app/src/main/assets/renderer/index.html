<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Mate Engine — renderer</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { display: block; width: 100%; height: 100%; background: transparent; touch-action: none; }
  #error {
    position: fixed; left: 8px; right: 8px; bottom: 8px; margin: 0;
    padding: 8px 10px; border-radius: 10px; font: 12px/1.4 system-ui, sans-serif;
    background: rgba(20, 24, 27, .92); color: #f3d3cf; border: 1px solid rgba(240, 144, 134, .45);
  }
  #error[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<p id="error" role="alert" hidden></p>
<script src="renderer.js"></script>
</body>
</html>
