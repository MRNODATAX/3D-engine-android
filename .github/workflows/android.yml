name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renderer:
    name: Renderer (build + uji render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pasang dependensi renderer
        working-directory: web
        run: npm ci
      - name: Ambil fixture uji berlisensi
        run: bash scripts/fetch-test-vrm.sh web/test-fixtures
      - name: Build bundle renderer
        working-directory: web
        run: npm run build
      - name: Pasang Chromium untuk uji render
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Uji render headless (VRM + transparansi + animasi)
        working-directory: web
        run: npm run test:render
      - name: Unggah bundle renderer
        uses: actions/upload-artifact@v4
        with:
          name: renderer-bundle
          path: |
            app/src/main/assets/renderer/renderer.js
            app/src/main/assets/renderer/index.html

  android:
    name: APK (uji unit + assemble)
    runs-on: ubuntu-latest
    needs: renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Ambil model uji (tidak disimpan di Git)
        run: bash scripts/fetch-test-vrm.sh app/src/main/assets/testmodels
      - name: Uji unit JVM
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Bangun APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Bangun APK release (unsigned bila secret signing belum diisi)
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Kumpulkan artefak
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: out/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release:
    name: Rilis bertanda tangan
    runs-on: ubuntu-latest
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Siapkan keystore dari secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi. Rilis tidak bisa ditandatangani."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Bangun APK release bertanda tangan
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash scripts/fetch-test-vrm.sh app/src/main/assets/testmodels
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "MateEngine-${GITHUB_REF_NAME}.apk"
      - name: Terbitkan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "MateEngine-${GITHUB_REF_NAME}.apk" \
            --title "Mate Engine Android ${GITHUB_REF_NAME}" \
            --notes "Dibangun otomatis dari commit ${GITHUB_SHA}. Lihat README untuk status kesetaraan fitur dan batasan perangkat." \
            --verify-tag
