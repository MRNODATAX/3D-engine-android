name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  renderer:
    name: Renderer (build + uji render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Pasang dependensi renderer
        working-directory: web
        run: npm ci
      - name: Ambil fixture uji berlisensi
        run: bash scripts/fetch-test-vrm.sh web/test-fixtures
      - name: Uji logika performa
        working-directory: web
        run: npm run test:perf
      - name: Uji mesin gerak
        working-directory: web
        run: npm run test:motion
      - name: Uji direktur perilaku
        working-directory: web
        run: npm run test:behavior
      - name: Uji berkas klip .vrma
        working-directory: web
        run: npm run test:vrma
      - name: Build bundle renderer
        working-directory: web
        run: npm run build
      - name: Pasang Chromium untuk uji render
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Uji render headless (VRM + transparansi + animasi)
        working-directory: web
        run: npm run test:render
      - name: Unggah bundle renderer
        uses: actions/upload-artifact@v4
        with:
          name: renderer-bundle
          path: |
            app/src/main/assets/renderer/renderer.js
            app/src/main/assets/renderer/index.html

  android:
    name: APK (uji unit + assemble)
    runs-on: ubuntu-latest
    needs: renderer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Ambil model uji (tidak disimpan di Git)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-test-vrm.sh app/src/main/assets/testmodels
      - name: Uji unit JVM
        run: bash scripts/ci-gradle.sh :app:testDebugUnitTest
      - name: Bangun APK debug
        run: bash scripts/ci-gradle.sh :app:assembleDebug
      - name: Bangun APK release (unsigned bila secret signing belum diisi)
        run: bash scripts/ci-gradle.sh :app:assembleRelease
      - name: Kumpulkan artefak
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: out/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release:
    name: Rilis APK
    runs-on: ubuntu-latest
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Ambil model uji (tidak disimpan di Git)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-test-vrm.sh app/src/main/assets/testmodels
      - name: Siapkan keystore bila secret tersedia
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bangun APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            bash scripts/ci-gradle.sh :app:assembleRelease
            APK=app/build/outputs/apk/release/app-release.apk
            NAME="MateEngine-${GITHUB_REF_NAME}.apk"
            echo "SIGNATURE=ditandatangani keystore rilis" >> "$GITHUB_ENV"
          else
            bash scripts/ci-gradle.sh :app:assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
            NAME="MateEngine-${GITHUB_REF_NAME}-debug.apk"
            echo "SIGNATURE=debug (secret signing belum diisi)" >> "$GITHUB_ENV"
          fi
          test -f "$APK"
          cp "$APK" "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SIGNED=${{ steps.keystore.outputs.signed }}" >> "$GITHUB_ENV"
      - name: Tulis catatan rilis
        run: |
          cat > notes.md <<NOTES
          Build otomatis dari commit ${GITHUB_SHA}.

          Tanda tangan: ${SIGNATURE}

          Status fitur (lihat docs/android-parity.md di repositori):
          - Sudah ada: impor VRM, overlay transparan + drag/skala 25-100%/cubit dua jari,
            opasitas, batas FPS, kunci posisi, render VRM 1.0/0.x, pemutar .vrma,
            diagnosa perangkat, chat Gemini dengan persona, Gemini TTS + lip-sync,
            gerak prosedural (napas, goyangan, pandangan, tidur, jalan, tari, reaksi sentuh).
          - Belum ada: duduk di jendela/taskbar, screenshot transparan, timer, Workshop,
            food system, head tracking kamera.

          Batasan: overlay Android berbentuk persegi (tidak ada click-through per piksel);
          service dapat dihentikan sistem bila optimasi baterai tidak dikecualikan.
          Model uji yang disertakan berlisensi redistribusi (pixiv Inc.), bukan avatar produk.
          NOTES
          cat notes.md
      - name: Terbitkan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" --title "Mate Engine Android ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" --title "Mate Engine Android ${GITHUB_REF_NAME} (uji)" --notes-file notes.md --verify-tag --prerelease
          fi
