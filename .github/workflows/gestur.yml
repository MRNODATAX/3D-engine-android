name: Uji gestur

# F5: regresi sentuh & gestur. Memakai satu emulator API 34 karena yang diuji adalah
# perilaku sentuh lapisan overlay, bukan perbedaan versi Android (itu tugas matriks API).
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gestur.yml"
      - "scripts/periksa-gestur.sh"
      - "scripts/baca-jendela.py"
      - "app/src/main/java/**"
      - "web/src/touch.js"
      - "web/src/reactions.js"

permissions:
  contents: read

jobs:
  gestur:
    name: Sentuh & gestur (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Aktifkan KVM untuk emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Ambil model uji berlisensi
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-test-vrm.sh app/src/main/assets/testmodels

      - name: Bangun APK debug
        run: bash scripts/ci-gradle.sh :app:assembleDebug

      - name: Jalankan uji gestur di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            set +e
            timeout -k 30 1200 bash scripts/periksa-gestur.sh
            kode=$?
            echo "kode keluar skrip: $kode" >> /tmp/gestur.txt
            exit $kode

      - name: Anotasi hasil
        if: always()
        run: |
          if [ -f /tmp/gestur.txt ]; then
            ringkas=$(tr '\n' '|' < /tmp/gestur.txt | cut -c1-4000)
            echo "::warning::gestur diagnostik: $ringkas"
          else
            echo "::warning::gestur: tidak ada diagnostik (langkah emulator tidak sampai menulis berkas)"
          fi
          LOG=/tmp/gestur-logcat.txt
          if [ -f "$LOG" ]; then
            potong=$(grep -E "MateEngineRender" "$LOG" | tail -12 | tr '\n' '|' | cut -c1-4000)
            if [ -n "$potong" ]; then echo "::warning::gestur log: $potong"; fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gestur
          path: |
            /tmp/gestur.txt
            /tmp/gestur-logcat.txt
            docs/screenshots/27-blokir-area-kosong.png
          if-no-files-found: warn
