name: Perangkat (matriks API)

# F3: minSdk 26 tetapi selama ini hanya API 34 yang pernah diuji. Job ini memasang APK yang
# sama di API 26 / 34 / 36 dan memeriksa overlay + FGS di tiap versi, dengan angka nyata
# dilaporkan di ringkasan job.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/device-matrix.yml"
      - "scripts/periksa-perangkat.sh"
      - "app/src/main/**"
      - "web/src/**"

permissions:
  contents: read

jobs:
  bangun:
    name: Bangun APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Ambil model uji berlisensi
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-test-vrm.sh app/src/main/assets/testmodels
      - name: Bangun APK debug
        run: bash scripts/ci-gradle.sh :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  matriks:
    name: API ${{ matrix.api }}
    needs: bangun
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 34, 36]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v5
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug

      - name: Aktifkan KVM untuk emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Jalankan emulator API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect -camera-back none -camera-front none
          # Batas waktu internal (15 mnt) supaya langkah ini berakhir sebelum job dibatalkan;
          # kalau dibatalkan, langkah diagnostik di bawah tidak pernah berjalan sehingga
          # penyebabnya tidak terbaca sama sekali.
          script: |
            set +e
            timeout -k 30 900 bash scripts/periksa-perangkat.sh ${{ matrix.api }}
            kode=$?
            echo "kode keluar skrip: $kode" >> /tmp/matriks-api${{ matrix.api }}.txt
            exit $kode

      - name: Tulis hasil ke ringkasan job
        if: always()
        run: |
          {
            echo "### API ${{ matrix.api }}"
            echo '```'
            cat /tmp/matriks-api${{ matrix.api }}.txt 2>/dev/null || echo "tidak ada diagnostik"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anotasi diagnostik dan galat perangkat
        if: always()
        run: |
          # Anotasi adalah satu-satunya cara membaca hasil dari sandbox pengembangan
          # (unduhan log & artefak Actions diblokir di sana). GitHub membatasi jumlah
          # anotasi per job, jadi seluruh diagnostik digabung menjadi SATU baris.
          DIAG="/tmp/matriks-api${{ matrix.api }}.txt"
          if [ -f "$DIAG" ]; then
            ringkas=$(tr '\n' '|' < "$DIAG" | cut -c1-4000)
            echo "::warning::API ${{ matrix.api }} diagnostik: $ringkas"
          else
            echo "::warning::API ${{ matrix.api }}: tidak ada diagnostik (langkah emulator tidak sampai menulis berkas)"
          fi
          LOG="/tmp/matriks-api${{ matrix.api }}-logcat.txt"
          if [ -f "$LOG" ]; then
            potong=$(grep -E "MateEngineRender|chromium|AndroidRuntime|FATAL" "$LOG" | tail -12 | tr '\n' '|' | cut -c1-4000)
            [ -n "$potong" ] && echo "::warning::API ${{ matrix.api }} log: $potong"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matriks-api${{ matrix.api }}
          path: |
            /tmp/matriks-api${{ matrix.api }}.txt
            /tmp/matriks-api${{ matrix.api }}.png
            /tmp/matriks-api${{ matrix.api }}-logcat.txt
          if-no-files-found: warn
